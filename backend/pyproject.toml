[project]
name = "electricai-backend"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg2-binary",
    "alembic",
    "pydantic-settings",
    "python-dotenv",
    "ruff>=0.16.0",
    "black>=26.5.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
